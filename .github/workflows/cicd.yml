# ==========================================================================
# AlphaForge CI
#
# Jobs
#   1. code_quality           - Python (autoflake, black) and Prettier formatting gate
#   2. backend_test_build     - C++ backend: CMake build and CTest, then Docker image
#                               build and container smoke test
#   3. ai_models_test         - AI models: Pytest with coverage on Python 3.11 and
#                               3.12 (includes the C++ parity golden tests), an
#                               end-to-end smoke test of the python -m ai_models CLI,
#                               then statistical validation of the models on data
#                               with a known truth (leakage, skill, determinism)
#   4. ai_services_test_build - AI service: Pytest with coverage, then Docker image
#                               build and container smoke test of every endpoint
#   5. frontend_test_build    - Frontend: Vitest with coverage, then production build
#
# Every job waits for code_quality, so formatting problems fail the run before
# any compiler or package manager is started. The jobs after it run in parallel
# and are independent: a failure in one does not stop the others, so one run
# reports every broken component.
# ==========================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Nothing here needs more than read access to the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Runs on
# main and develop are never cancelled, so every commit there gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new Black release cannot change formatting under our feet.
      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      # Check-only: nothing is rewritten. Covers the data fetch script.
      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Solidity plugin lets the same glob below also cover .sol files.
      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      # One Prettier pass over the whole repository (TS/TSX, JSON, HTML, CSS,
      # Markdown, Solidity and YAML, including this workflow).
      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ===========================================================================
  # Job 2 -- Backend Test & Build (CMake + CTest + Docker image + smoke test)
  # ===========================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: alphaforge
      CONTAINER_NAME: alphaforge-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      # Release build of every target: the engine library, the CLI, the REST
      # server, the benchmarks and the unit test binary.
      - name: Configure
        run: cmake -S "${BACKEND_DIR}" -B "${BACKEND_DIR}/build" -DCMAKE_BUILD_TYPE=Release

      - name: Build backend
        run: cmake --build "${BACKEND_DIR}/build" -j

      # CTest runs the unit test binary (market data, portfolio, risk, backtest
      # and strategy tests) and prints the output of any failing test.
      - name: Run backend test suite
        run: cd "${BACKEND_DIR}/build" && ctest --output-on-failure

      # Buildx enables the GitHub Actions layer cache used by the build step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false + load: true builds the image locally for the smoke test
      # without publishing it. The Dockerfile fetches market data from Yahoo at
      # build time and only warns if that fails, so the image still builds
      # without network access.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Starts the real container and polls /api/health for up to 60 seconds; the
      # server must answer with status ok.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name "${CONTAINER_NAME}" -p 8080:8080 "${IMAGE_NAME}:ci"
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health -o health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Server did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi
          cat health.json
          echo
          grep -q '"status":"ok"' <(tr -d ' \n' < health.json)

      # Only runs when an earlier step failed, to make the failure diagnosable.
      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      # Always clean up, even when the smoke test fails.
      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ======================================================================
  # Job 3 -- AI Models Test & Validation
  #          (Pytest + coverage, CLI smoke test, statistical model validation)
  # ======================================================================
  # ai_models is a library plus a command line (python -m ai_models), not a
  # service, so it has no image. On every supported Python this job does three
  # different things:
  #   Test        unit tests prove each function does what it says;
  #   Smoke test  the real CLI trains, stores, lists and predicts end to end;
  #   Validation  the trained models are checked against data whose truth is
  #               known: no skill on noise (so no look-ahead leak), real skill
  #               when a signal is planted, a deliberate leak that must be
  #               caught, deterministic and reloadable models, valid outputs.
  # None of it needs market data, a network or a C++ build: the parity tests
  # replay a golden file captured from the engine
  # (code/ai_models/tests/golden/cpp_backtests.json).
  ai_models_test:
    name: AI Models Test & Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 30

    strategy:
      # Let both versions finish so a failure on one shows whether it is specific to it.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: code/ai_models/requirements*.txt

      # requirements-dev.txt is the runtime set plus pytest and pytest-cov.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/ai_models/requirements-dev.txt

      # pytest.ini turns DeprecationWarnings raised inside ai_models into errors,
      # so an upstream deprecation shows up here before it becomes a breakage.
      # The floor sits below the current coverage on purpose: it catches a
      # collapse, not a one-line drift.
      - name: Run ai_models test suite
        working-directory: code/ai_models
        run: |
          set -euo pipefail
          pytest \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90 \
            --junitxml=junit.xml

      # Uploaded even when tests fail, so results are available for debugging.
      - name: Upload ai_models test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-test-results-py${{ matrix.python-version }}
          path: |
            code/ai_models/coverage.xml
            code/ai_models/junit.xml
          if-no-files-found: ignore
          retention-days: 30

      # Trains, stores, lists, predicts and evaluates through the real CLI, each
      # command in its own process, on synthetic data. See the script for the checks.
      - name: Smoke test the ai_models CLI
        run: python scripts/smoke_test_ai_models.py

      # Validation, as opposed to testing: runs the real training and evaluation
      # code on synthetic data with a known truth and checks the results against
      # it (28 checks across the direction, volatility, regime and anomaly models
      # and the pipeline around them). Each check reports what it measured and
      # what it required, as a table in the job summary and in the JSON report. A
      # defect such as a look-ahead leak fails by a wide margin; a healthy
      # pipeline passes with room to spare on every supported Python.
      - name: Validate the models
        run: python scripts/validate_ai_models.py --report validation-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-validation-report-py${{ matrix.python-version }}
          path: validation-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- AI Services Test & Build (Pytest + Docker image + smoke test)
  # ============================================================
  ai_services_test_build:
    name: AI Services Test & Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      IMAGE_NAME: alphaforge-ai-services
      CONTAINER_NAME: alphaforge-ai-services-ci
      # ai_services and ai_models are imported as top-level packages, so code/
      # must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.12 is the version the Docker image runs, so the tests match production.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            code/ai_services/requirements*.txt
            code/ai_models/requirements*.txt

      # requirements-dev.txt chains to ../ai_models/requirements.txt, the same set
      # the Docker image installs, and adds httpx (FastAPI's TestClient), pytest
      # and pytest-cov.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/ai_services/requirements-dev.txt

      # The service tests train real models on synthetic data, so they need no
      # market data and no network.
      - name: Run ai_services test suite
        working-directory: code/ai_services
        run: |
          set -euo pipefail
          pytest \
            --cov=ai_services \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90 \
            --junitxml=junit.xml

      # Uploaded even when tests fail, so results are available for debugging.
      - name: Upload ai_services test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-services-test-results
          path: |
            code/ai_services/coverage.xml
            code/ai_services/junit.xml
          if-no-files-found: ignore
          retention-days: 30

      # Buildx enables the GitHub Actions layer cache used by the build step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The context is code/ (not code/ai_services/) because the service imports
      # the sibling ai_models package. push: false + load: true builds the image
      # locally for the smoke test without publishing it.
      - name: Build AI services image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/ai_services/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha,scope=ai-services
          cache-to: type=gha,mode=max,scope=ai-services

      # The image ships no market data. The smoke test mounts a directory of
      # synthetic CSVs, exactly as a real deployment mounts its own.
      - name: Prepare smoke test data
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from ai_models.testing import synthetic_bars, write_csv

          root = Path(os.environ["RUNNER_TEMP"]) / "ai-services-smoke" / "data"
          for seed, symbol in enumerate(["AAA", "BBB"], start=20):
              write_csv(synthetic_bars(n=450, seed=seed), root / f"{symbol}.csv")
          PY

      # Starts the real container (python -m ai_services) with auto-training on, so
      # it trains models for the mounted data before it starts answering. The
      # script waits for /ai/health, then checks every endpoint and the error shape.
      - name: Smoke test the built image
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8090:8090 \
            -v "${RUNNER_TEMP}/ai-services-smoke/data:/data:ro" \
            "${IMAGE_NAME}:ci"

          echo "=== Container must not run as root ==="
          uid=$(docker exec "${CONTAINER_NAME}" id -u)
          echo "uid=${uid}"
          if [ "${uid}" = "0" ]; then
            echo "The AI service container runs as root." >&2
            exit 1
          fi

          echo "=== Exercising the API ==="
          python scripts/smoke_test_ai_service.py \
            --base-url http://127.0.0.1:8090 \
            --symbols AAA BBB \
            --timeout 180

          echo "=== Waiting for the Docker healthcheck to report healthy ==="
          status=unknown
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "${CONTAINER_NAME}")
            if [ "${status}" = "healthy" ]; then
              break
            fi
            sleep 3
          done
          echo "health status: ${status}"
          if [ "${status}" != "healthy" ]; then
            echo "The image HEALTHCHECK never reported healthy." >&2
            exit 1
          fi

      # Only runs when an earlier step failed, to make the failure diagnosable.
      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      # Always clean up, even when the smoke test fails.
      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ======================================================================
  # Job 5 -- Frontend Test & Build (Vitest + coverage + production build)
  # ======================================================================
  frontend_test_build:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      # Vitest suite (jsdom): formatting helpers, the API client, the auth
      # context, route guards, the sign in and sign up pages, and app routing.
      # Runs before the build so test failures show up first.
      - name: Run frontend test suite
        run: npm run test:coverage

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 30

      # The build type-checks the whole of src/ first (tsc --noEmit), test files
      # included, then bundles the app with Vite.
      - name: Build frontend
        run: npm run build

      # Keeps the production bundle for a week so it can be inspected.
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
