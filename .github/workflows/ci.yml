name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake
      - name: Configure
        run: cmake -S code/backend -B code/backend/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build code/backend/build -j
      - name: Test
        run: cd code/backend/build && ctest --output-on-failure

  backend_build:
    name: backend_build
    runs-on: ubuntu-latest
    needs: backend
    env:
      IMAGE_NAME: alphaforge
      CONTAINER_NAME: alphaforge-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name "${CONTAINER_NAME}" -p 8080:8080 "${IMAGE_NAME}:ci"
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health -o health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Server did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi
          cat health.json
          echo
          grep -q '"status":"ok"' <(tr -d ' \n' < health.json)
      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true
      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd frontend && npm ci || npm install
      - name: Build
        run: cd frontend && npm run build
